  /api/v1/projects/{project_id}/milestones:
    parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
    get:
      operationId: listProjectMilestones
      tags: [milestones]
      summary: List a project's milestones (e.g. overnight progress)
      description: |
        Milestones of all of a project's runs, in chronological order: by
        `occurred_at`, then `run_id`, then `sequence`.

        The overnight view is this query with `since` and `until`. Combine it
        with the project's status and its pending approvals. Every milestone
        whose current status was reached in the window is returned, so a
        client can derive:
        - what succeeded: `status` completed;
        - what failed: failed;
        - what was repaired: `resolves_milestone_id` is set;
        - what is blocked: blocked.

        A milestone's `occurred_at` moves forward when its status changes, so
        a milestone can appear again, with its new status, on a later page of
        the same listing. Clients keep the latest copy of each `id`.
      x-permission: milestones:read
      parameters:
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
        - $ref: '#/components/parameters/MilestoneStatusFilter'
        - $ref: '#/components/parameters/MilestoneCategoryFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of milestones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestonePage'
              examples:
                overnight:
                  summary: 'Overnight progress, 22:00-07:00 New York time (EDT, UTC-4)'
                  value:
                    items:
                      - id: ms-669b73e90843c2bc78ba
                        project_id: prj-4f6c2a9e1b7d3c5a8e0f
                        run_id: run-2
                        sequence: 1
                        type: plan_ready
                        category: workflow
                        title: Plan ready
                        summary: Load the client sales files into the warehouse in three steps.
                        status: completed
                        occurred_at: '2026-10-02T03:42:00.000000Z'
                        source: {node: planner, agent: planner}
                        follows: null
                        resolves_milestone_id: null
                        approval_id: null
                      - id: ms-afb5bd61d240d31147e6
                        project_id: prj-4f6c2a9e1b7d3c5a8e0f
                        run_id: run-2
                        sequence: 2
                        type: implementation_ready
                        category: workflow
                        title: Implementation ready
                        summary: Loader, transformer, and warehouse writer implemented.
                        status: completed
                        occurred_at: '2026-10-02T04:18:00.000000Z'
                        source: {node: developer, agent: developer}
                        follows: {node: planner, outcome: planned}
                        resolves_milestone_id: null
                        approval_id: null
                      - id: ms-0176bde3b6b7d006ec20
                        project_id: prj-4f6c2a9e1b7d3c5a8e0f
                        run_id: run-2
                        sequence: 3
                        type: tests_passing
                        category: workflow
                        title: Tests passing
                        summary: 12 tests, FAILED (2 failing)
                        status: failed
                        occurred_at: '2026-10-02T04:51:00.000000Z'
                        source: {node: tester, agent: tester}
                        follows: {node: developer, outcome: implemented}
                        resolves_milestone_id: null
                        approval_id: null
                      - id: ms-34f4fbf1044325c00207
                        project_id: prj-4f6c2a9e1b7d3c5a8e0f
                        run_id: run-2
                        sequence: 4
                        type: implementation_ready
                        category: workflow
                        title: Implementation ready
                        summary: Fix date parsing for European formats.
                        status: completed
                        occurred_at: '2026-10-02T05:31:00.000000Z'
                        source: {node: developer, agent: developer}
                        follows: {node: tester, outcome: fail}
                        resolves_milestone_id: null
                        approval_id: null
                      - id: ms-b5e25680253d1631e6b0
                        project_id: prj-4f6c2a9e1b7d3c5a8e0f
                        run_id: run-2
                        sequence: 5
                        type: tests_passing
                        category: workflow
                        title: Tests passing
                        summary: 12 tests, passed
                        status: completed
                        occurred_at: '2026-10-02T05:42:00.000000Z'
                        source: {node: tester, agent: tester}
                        follows: {node: developer, outcome: implemented}
                        resolves_milestone_id: ms-0176bde3b6b7d006ec20
                        approval_id: null
                      - id: ms-adbb0998142201d66f65
                        project_id: prj-4f6c2a9e1b7d3c5a8e0f
                        run_id: run-2
                        sequence: 6
                        type: review_approved
                        category: workflow
                        title: Review approved
                        summary: Correct, tested, documented.
                        status: completed
                        occurred_at: '2026-10-02T06:14:00.000000Z'
                        source: {node: reviewer, agent: reviewer}
                        follows: {node: tester, outcome: pass}
                        resolves_milestone_id: null
                        approval_id: null
                      - id: ms-7a57604ba8e5bafff947
                        project_id: prj-4f6c2a9e1b7d3c5a8e0f
                        run_id: run-2
                        sequence: 7
                        type: human_decision
                        category: approval
                        title: Human decision
                        summary: 'Approval needed: deployer wants to run deploy_release'
                        status: blocked
                        occurred_at: '2026-10-02T06:16:00.000000Z'
                        source: {node: deploy, agent: deployer}
                        follows: null
                        resolves_milestone_id: null
                        approval_id: apr-d2d69f6b7a0ce595
                    next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/projects/{project_id}/runs/{run_id}/milestones:
    parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      - $ref: '#/components/parameters/RunIdPath'
    get:
      operationId: listRunMilestones
      tags: [milestones]
      summary: List one run's milestones (its timeline)
      description: |
        Milestones of one run, in chronological order. The same rules apply
        as for the project-wide listing. Returns 404 if the run does not
        exist, rather than an empty list.
      x-permission: milestones:read
      parameters:
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
        - $ref: '#/components/parameters/MilestoneStatusFilter'
        - $ref: '#/components/parameters/MilestoneCategoryFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of the run's milestones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestonePage'
              examples:
                first_page:
                  summary: First page of a long timeline
                  value:
                    items:
                      - id: ms-669b73e90843c2bc78ba
                        project_id: prj-4f6c2a9e1b7d3c5a8e0f
                        run_id: run-2
                        sequence: 1
                        type: plan_ready
                        category: workflow
                        title: Plan ready
                        summary: Load the client sales files into the warehouse in three steps.
                        status: completed
                        occurred_at: '2026-10-02T03:42:00.000000Z'
                        source: {node: planner, agent: planner}
                        follows: null
