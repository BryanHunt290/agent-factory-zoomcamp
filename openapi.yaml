openapi: 3.1.0
info:
  title: Agent Factory API
  version: 1.0.0-draft
  summary: Contract between the dashboard, the mobile approval screen, and the Agent Factory backend.
  description: |
    **Status: DRAFT CONTRACT, implemented by a local development backend**
    (`python -m agent_factory api serve`; see `docs/backend.md`). It was
    designed contract-first, before any backend code (see
    `docs/api-contract.md`). Every operation requires an authenticated
    identity holding the operation's permission (`x-permission`; see
    `docs/authentication.md`). The backend still listens on 127.0.0.1 only:
    public exposure needs a deployment design that does not exist yet.

    ## What the API is for

    - Show projects, their runs, and the milestones they reached, for example
      what happened overnight.
    - Show approval requests, and record a human decision on one.
    - Create a project from a template.

    ## What the API deliberately cannot do

    These capabilities are absent by design. They are not merely unimplemented.

    - Run commands, shell scripts, or sandbox executions.
    - Change a run's execution state: start, stop, resume, or edit the graph
      or checkpoint. Workers own execution.
    - Create, edit, or delete milestones. Agent Factory produces them.
    - Change an approval request or its action fingerprint.
    - Set a decision's time or actor, or mark any identity as verified. The
      server decides these.

    A recorded APPROVED decision never authorizes anything by itself. A
    worker applies it only after re-checking that its action fingerprint
    still matches the exact action the engine is paused on.

    ## Conventions

    - **Versioning:** all paths start with `/api/v1`. Within v1, changes are
      additive only. Breaking changes require `/api/v2`.
    - **Time:** every timestamp is UTC ISO 8601 ending in `Z`, for example
      `2026-10-02T06:16:00.000000Z`. Clients convert to local time for display.
    - **Errors:** problem details (RFC 9457) as `application/problem+json`,
      with a stable `code` and a `request_id`. They never contain stack
      traces, credentials, file paths, or database details. A path or method
      outside this contract gets 404 `route_not_found` or 405
      `method_not_allowed`, in the same format.
    - **Pagination:** cursor-based; `limit` plus an opaque `cursor`, and pages
      of `items` with `next_cursor`.
    - **Authentication:** every operation needs `Authorization: Bearer
      <token>`, a JWT access token from the configured OpenID Connect
      provider, verified by the backend (signature with the provider's
      published keys, issuer, audience, expiry). The identity is the token's
      issuer and subject, mapped to an enrolled principal; an email address
      never identifies anyone. No production identity provider is chosen
      yet; a local development issuer exists for development only.
    - **Authorization:** each operation requires exactly one permission,
      named in its `x-permission`, checked on the server for every request.
      No permission implies another. 401: no credential, or a refused one.
      403: a valid identity without the permission. 429: too many refused
      credentials, or too many decisions.
tags:
  - name: projects
    description: Projects handed to Agent Factory, with their current status.
  - name: templates
    description: The kinds of project Agent Factory can run.
  - name: runs
    description: Executions of a project's workflow. Read-only; workers own execution.
  - name: milestones
    description: Human-facing progress. Read-only; Agent Factory produces milestones.
  - name: approvals
    description: Protected actions waiting for a human decision, and those decisions.
security:
  - bearerAuth: []
paths:
  /api/v1/projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects (the dashboard)
      description: |
        Projects, newest first (by creation time, then ID). Each one carries
        its current status, its latest run, and its number of pending
        approvals.

        Pass `activity_since` to also count each project's milestones reached
        since that time. This is how the dashboard shows "7 milestones
        overnight" in a single request.
      x-permission: projects:read
      parameters:
        - $ref: '#/components/parameters/ActivitySince'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSummaryPage'
              examples:
                dashboard:
                  summary: Two projects, with overnight activity
                  value:
                    items:
                      - id: prj-4f6c2a9e1b7d3c5a8e0f
                        name: Client ETL Pipeline
                        template: data-pipeline
                        status: awaiting_approval
                        latest_run:
                          run_id: run-2
                          number: 2
                          status: awaiting_approval
                          updated_at: '2026-10-02T06:16:00.000000Z'
                        pending_approvals: 1
                        activity:
                          since: '2026-10-02T02:00:00.000000Z'
                          milestones: 7
                      - id: prj-9b1e7c3a5d2f8e4c6a0b
                        name: Invoice Calculator
                        template: calculator
                        status: completed
                        latest_run:
                          run_id: run-1
                          number: 1
                          status: completed
                          updated_at: '2026-10-02T09:20:00.000000Z'
                        pending_approvals: 0
                        activity:
                          since: '2026-10-02T02:00:00.000000Z'
                          milestones: 12
                    next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project from a template
      description: |
        Registers a new project. Its stable ID is generated by the server and
        is never derived from a path. Its milestone vocabulary comes from the
        template.

        This does not start a run, and it does not touch any filesystem the
        client can see. A worker prepares the project's workspace when it
        first needs it.

        **Idempotency:** the `Idempotency-Key` header is required.
        - Repeating a request with the same key and the same body returns the
          original response (same status and body) with
          `Idempotent-Replayed: true`. A retried request never creates a
          second project.
        - The same key with a different body is refused with 409 Conflict,
          `idempotency_key_reused`: the key is already bound to a different
          request. Send the new request with a new key.
        - While the first request with a key is still being processed, the
          same key gets 409 Conflict, `idempotency_key_in_use`: retry the
          same request later.
        - Keys are kept for at least 24 hours.
      x-permission: projects:create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
            examples:
              calculator:
                summary: A project from the calculator template
                value:
                  name: Invoice Calculator
                  template: calculator
                  description: Four-function calculator used by the invoicing service.
      responses:
        '201':
          description: The project was created (or this is a replay of the request that created it).
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              examples:
                created:
                  summary: A new project, no runs yet
                  value:
                    id: prj-9b1e7c3a5d2f8e4c6a0b
                    name: Invoice Calculator
                    description: Four-function calculator used by the invoicing service.
                    template: calculator
                    created_at: '2026-10-01T15:00:00.000000Z'
                    status: not_started
                    latest_run: null
                    pending_approvals: 0
                    activity: null
                    milestone_types:
                      - type: human_decision
                        title: Human decision
                        category: approval
                        description: A protected action waited for, and then received, a human decision.
                        order: null
                      - type: run_finished
                        title: Run finished
                        category: lifecycle
                        description: The run reached a final state.
                        order: null
                      - type: plan_ready
                        title: Plan ready
                        category: workflow
                        description: A structured plan was produced.
                        order: 1
                      - type: implementation_ready
                        title: Implementation ready
                        category: workflow
                        description: Code was written for the plan.
                        order: 2
                      - type: tests_passing
                        title: Tests passing
                        category: workflow
                        description: The project's tests pass.
                        order: 3
                      - type: review_approved
                        title: Review approved
                        category: workflow
                        description: A reviewer approved the implementation.
                        order: 4
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
    get:
      operationId: getProject
      tags: [projects]
      summary: Get one project and its current status
      description: |
        The project, its current status (that of its latest run), and its
        milestone vocabulary. A client can use the vocabulary's `order` to
        show milestones that have not been reached yet.
      x-permission: projects:read
      parameters:
        - $ref: '#/components/parameters/ActivitySince'
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              examples:
                waiting:
                  summary: A project whose run is waiting for an approval
                  value:
                    id: prj-4f6c2a9e1b7d3c5a8e0f
                    name: Client ETL Pipeline
                    description: Nightly load of client sales data into the warehouse.
                    template: data-pipeline
                    created_at: '2026-09-28T14:05:00.000000Z'
                    status: awaiting_approval
                    latest_run:
                      run_id: run-2
                      number: 2
                      status: awaiting_approval
                      updated_at: '2026-10-02T06:16:00.000000Z'
                    pending_approvals: 1
                    activity:
                      since: '2026-10-02T02:00:00.000000Z'
                      milestones: 7
                    milestone_types:
                      - type: human_decision
                        title: Human decision
                        category: approval
                        description: A protected action waited for, and then received, a human decision.
                        order: null
                      - type: run_finished
                        title: Run finished
                        category: lifecycle
                        description: The run reached a final state.
                        order: null
                      - type: plan_ready
                        title: Plan ready
                        category: workflow
                        description: A structured plan was produced.
                        order: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List the templates a project can be created from
      description: |
        The template names `createProject` accepts, with each template's
        milestone vocabulary. The list is short, so it is not paginated.
      x-permission: projects:read
      responses:
        '200':
          description: All templates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateList'
              examples:
                today:
                  summary: The one template that exists today
                  value:
                    items:
                      - name: calculator
                        description: Implement a four-function calculator module that passes the acceptance tests.
                        milestone_types:
                          - type: plan_ready
                            title: Plan ready
                            category: workflow
                            description: A structured plan was produced.
                            order: 1
                          - type: tests_passing
                            title: Tests passing
                            category: workflow
                            description: The project's tests pass.
                            order: 3
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/projects/{project_id}/runs:
    parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
    get:
