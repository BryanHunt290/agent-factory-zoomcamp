    ReconciliationConflict:
      description: |
        The answer conflicts with the action's current state. Nothing was
        recorded. Codes:
        - `reconciliation_not_required`: the action's outcome is not uncertain (nothing to answer);
        - `reconciliation_stale`: the execution or attempt is not the one now waiting for an answer;
        - `action_fingerprint_mismatch`: the fingerprint is not that of this action;
        - `reconciliation_already_decided`: a different answer is already recorded for this attempt.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            stale:
              summary: The screen showed an earlier attempt
              value:
                type: 'urn:agent-factory:problem:reconciliation_stale'
                title: Reconciliation is stale
                status: 409
                detail: This answer is about an attempt that is no longer the one waiting. Reload the approval and answer again.
                instance: /api/v1/projects/prj-4f6c2a9e1b7d3c5a8e0f/approvals/apr-0b1c2d3e4f5a6b7c/reconciliation
                code: reconciliation_stale
                request_id: req_V7c3nR8xTb2L
    ValidationFailed:
      description: |
        The request is well-formed but invalid: a body field or a query parameter. Codes:
        - `validation_failed`: a field or parameter is missing, of the wrong type, out of range, or not allowed (including server-controlled fields such as `decided_at`); see `errors`;
        - `unknown_template`: no template has that name.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing_fingerprint:
              summary: A decision without the action fingerprint
              value:
                type: 'urn:agent-factory:problem:validation_failed'
                title: Validation failed
                status: 422
                detail: The request body is invalid.
                instance: /api/v1/projects/prj-4f6c2a9e1b7d3c5a8e0f/approvals/apr-d2d69f6b7a0ce595/decision
                code: validation_failed
                request_id: req_V6n1cR8yTb2M
                errors:
                  - location: body
                    pointer: /action_fingerprint
                    message: Required.
                  - location: body
                    pointer: /decided_at
                    message: Not allowed; the server sets the decision time.
    InternalError:
      description: '`internal_error`: an unexpected failure. The response never contains stack traces or internal details. Quote `request_id` when reporting it.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: |
        Nothing was recorded. Retry after `Retry-After` seconds. Codes:
        - `storage_unavailable`: the product database cannot be reached;
        - `authentication_unavailable`: the identity provider's signing keys
          cannot be obtained, so no credential can be verified (fail closed).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            database_down:
              value:
                type: 'urn:agent-factory:problem:storage_unavailable'
                title: Storage unavailable
                status: 503
                detail: The service cannot reach its database. Nothing was recorded; try again shortly.
                code: storage_unavailable
                request_id: req_S9d4fG2hJk1L
