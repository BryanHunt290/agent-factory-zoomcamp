  /api/v1/attention:
    get:
      operationId: listAttention
      tags: [approvals]
      summary: What needs a person now (the attention inbox)
      description: |
        Everything waiting for a human, across all projects (or one), oldest
        first (by `since`, then project, then approval):

        - `decision_required`: an approval request that is pending and has not
          expired. Approve or reject it with `decideApproval`
          (`approvals:decide`).
        - `reconciliation_required`: an approved action whose outcome is
          unknown, and for whose uncertain attempt nobody has answered yet.
          Say whether it happened with `reconcileAction` (`actions:reconcile`).

        The server decides what needs attention, including expiry, so a
        client never inspects engine state. Each item names its approval;
        `getApproval` shows the full action, its execution, and its timeline.

        **Why one list.** The phone's first screen needs both kinds, in one
        order, behind one cursor. Two client queries would need two cursors
        and a client-side merge, and uncertain actions have no other listing.
      x-permission: approvals:read
      parameters:
        - $ref: '#/components/parameters/ProjectIdFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
