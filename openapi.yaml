  /api/v1/projects/{project_id}/approvals/{approval_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      - $ref: '#/components/parameters/ApprovalIdPath'
    get:
      operationId: getApproval
      tags: [approvals]
      summary: Get one approval request (the approval screen)
      description: |
        Everything the approval screen shows:
        - the project, agent, and workflow step;
        - the exact action and its fingerprint, and a safe one-line summary;
        - the reason, the plain-language risk, when it was requested, and
          when it expires;
        - the decision, once one exists, with the authenticated person who
          made it;
        - what happened to the approved action (`execution`), and every step
          so far (`timeline`): dispatches, outcomes, and reconciliations,
          built from structured records, never raw logs;
        - `attention`: whether a decision or a reconciliation is needed now.

        `status` shows `expired` as soon as a pending request's `expires_at`
        has passed.

        Approval IDs are unique within a project only, so the project is part
        of the path.
      x-permission: approvals:read
      responses:
        '200':
          description: The approval request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
              examples:
                pending:
                  $ref: '#/components/examples/PendingDeployment'
                approved:
                  $ref: '#/components/examples/ApprovedDeployment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/projects/{project_id}/approvals/{approval_id}/decision:
    parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      - $ref: '#/components/parameters/ApprovalIdPath'
    post:
      operationId: decideApproval
      tags: [approvals]
      summary: Approve or reject the exact action of one approval request
      description: |
        Records a decision for exactly the action this request describes.

        **Exact-action binding.** The client sends the `action_fingerprint`
        it showed the user. The decision is recorded only if that equals the
        fingerprint of the stored request; otherwise 409
        `action_fingerprint_mismatch`, and nothing is recorded.

        **What this does not do.** It neither executes the action nor resumes
        the run. It records the decision and makes the run eligible for a
        worker, in one transaction. The worker that claims the run applies the
        decision only after re-checking it against the exact action the engine
        is paused on, the approval's expiry, and the person who decided. A
        database row saying "approved" never authorizes any other action.
        Watch the run's status, or the approval's `timeline`, to see it resume.

        **Expiry.** A request can be decided only before `expires_at` (12
        hours after it was requested, by default); afterwards 409
        `approval_expired`. An approved action must also begin before
        `expires_at`, or it is never sent. Expiry never renews: asking again is
        a new request.

        **One decision, safe retries.** An approval request has at most one
        decision. The approval itself is the idempotency key, so no
        `Idempotency-Key` header is needed.

        | Request | Response |
        | --- | --- |
        | First decision | 201 Created |
        | Repeat of the same decision (same outcome and fingerprint, same person), e.g. a phone retry | 200 OK, with the decision already recorded; nothing new is stored |
        | Different outcome, or a different person, after a decision exists | 409 `approval_already_decided`, with the current approval in the response |
        | Two decisions arriving at the same moment | Settled exactly as if they had arrived one after the other |

        **Server-controlled fields.** The server sets the decision time and
        records who decided: the authenticated principal, verified from the
        access token. The request body can carry neither, and a client can
        never mark an identity as verified. Authentication proves *who*
        decided; the action fingerprint proves *what* they decided. Both are
        required.

        **Permission.** `approvals:decide`; `approvals:read` alone is not
        enough. Decisions are also limited per principal (429 with
        `Retry-After`).
      x-permission: approvals:decide
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
            examples:
              approve:
                summary: Approve from a phone
                value:
                  outcome: approved
                  action_fingerprint: 'sha256:f0fd6f8ce462b499fc1bf44e47c09213e79eb6d9d6775503da2d2dc149937f05'
                  comment: Approved from mobile
              reject:
                summary: Reject, with a reason
                value:
                  outcome: rejected
                  action_fingerprint: 'sha256:f0fd6f8ce462b499fc1bf44e47c09213e79eb6d9d6775503da2d2dc149937f05'
                  comment: Not during business hours.
      responses:
        '201':
          description: The decision was recorded by this request. The response is the approval with its decision.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
              examples:
                recorded:
                  $ref: '#/components/examples/ApprovedDeployment'
        '200':
          description: This exact decision was already recorded, for example by an earlier attempt of a retried request. Nothing new was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
              examples:
                replayed:
                  $ref: '#/components/examples/ApprovedDeployment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ApprovalConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/projects/{project_id}/approvals/{approval_id}/reconciliation:
    parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      - $ref: '#/components/parameters/ApprovalIdPath'
    post:
      operationId: reconcileAction
      tags: [approvals]
      summary: Say whether an approved action with an unknown outcome happened
      description: |
        When an approved action was sent and Agent Factory cannot tell whether
        it took effect (a timeout after sending, a crash mid-action), the run
        waits (`awaiting_reconciliation`) and the approval's `attention` is
        `reconciliation_required`. A person who checked answers here, for
        exactly the attempt they were shown:

        | `choice` | Meaning | What follows |
        | --- | --- | --- |
        | `it_happened` | It took effect | The run continues as if it succeeded. Nothing is sent again. |
        | `did_not_happen` | It did not take effect, and must not be retried | The run continues without it. |
        | `did_not_happen_retry` | It did not take effect, and may be tried once more | A **new** authorization for one more attempt, valid for 15 minutes from this decision. The original approval is never reactivated. |

        There is no "I don't know, just retry": a retry asserts that the
        action did not happen.

        **Exact binding.** The body echoes `execution_id`, `attempt`, and
        `action_fingerprint` from the approval's `execution` and
        `action_fingerprint`. A stale or altered screen gets 409, and nothing
        is recorded.

        **What this does not do.** It records the answer and wakes the run,
        in one transaction. A worker that holds the run's claim re-checks the
        answer, applies it to the record of the action, and continues the run.
        This request sends nothing.

        **One answer per attempt, safe retries.**

        | Request | Response |
        | --- | --- |
        | First answer | 201 Created |
        | Repeat of the same answer by the same person | 200 OK; nothing new is stored |
        | A different answer, or another person, after one exists | 409 `reconciliation_already_decided` |

        **Server-controlled fields.** The server sets the time and records
        the authenticated principal as the one who answered.

        **Permission.** `actions:reconcile`. `approvals:decide` does not allow
        this. Answers count, with decisions, against the per-principal limit
        (429 with `Retry-After`).
      x-permission: actions:reconcile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconciliationRequest'
            examples:
              it_happened:
                summary: It did take effect
                value:
                  execution_id: axe-8e2f0c7d1b6a5f4e3d2c
                  attempt: 1
                  action_fingerprint: 'sha256:764f762737837d792c339a4977418ac0f2948e9bf762fb21f36f352fa78e61b2'
                  choice: it_happened
                  comment: The notice is in the customer's inbox.
              retry:
                summary: It did not happen; try once more
                value:
                  execution_id: axe-8e2f0c7d1b6a5f4e3d2c
                  attempt: 1
                  action_fingerprint: 'sha256:764f762737837d792c339a4977418ac0f2948e9bf762fb21f36f352fa78e61b2'
                  choice: did_not_happen_retry
                  comment: The gateway has no record of it.
      responses:
        '201':
          description: The answer was recorded by this request. The response is the approval, with its execution and timeline.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
              examples:
                recorded:
                  $ref: '#/components/examples/ReconciledNotice'
        '200':
          description: This exact answer was already recorded. Nothing new was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
              examples:
                replayed:
                  $ref: '#/components/examples/ReconciledNotice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReconciliationConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        OAuth 2.0 bearer access tokens (RFC 6750): JWTs issued by an
        established OpenID Connect provider and verified by the backend,
        which acts as a resource server. A token is accepted only if its
        signature verifies with a key the provider published (asymmetric
        algorithms only, never `none` or HMAC), its `iss` is exactly the
        configured issuer, its `aud` contains the configured audience, it has
        not expired, and its issuer and subject belong to an enrolled, active
        principal. `decided_by` comes from that principal.

        **Implemented:** token verification, principals, permissions, and
        their enforcement on every operation. **Not yet:** a chosen and
        configured production identity provider (one is configured per
        deployment), and browser sign-in (with the frontend). No homegrown
        login protocol exists, and the API still listens on 127.0.0.1 only.
      bearerFormat: JWT
      x-agent-factory-status: implemented
  parameters:
    ProjectIdPath:
      name: project_id
      in: path
      required: true
      description: The project's stable ID.
      schema:
        $ref: '#/components/schemas/ProjectId'
    RunIdPath:
      name: run_id
      in: path
      required: true
      description: The run's ID, which is unique within its project.
      schema:
        $ref: '#/components/schemas/RunId'
    ApprovalIdPath:
      name: approval_id
      in: path
      required: true
      description: The approval request's ID, which is unique within its project.
      schema:
        $ref: '#/components/schemas/ApprovalId'
    ProjectIdFilter:
      name: project_id
      in: query
      required: false
      description: Only this project's approvals. Returns 404 if the project does not exist.
      schema:
        $ref: '#/components/schemas/ProjectId'
    ApprovalStatusFilter:
      name: status
      in: query
      required: true
      description: Which approvals to list. v1 supports only `pending`.
      schema:
        type: string
        enum: [pending]
    ActivitySince:
      name: activity_since
      in: query
      required: false
      description: Also count each project's milestones reached at or after this time (UTC).
      schema:
        $ref: '#/components/schemas/Timestamp'
    Since:
      name: since
      in: query
      required: false
      description: Only milestones whose current status was reached at or after this time (inclusive, UTC).
      schema:
        $ref: '#/components/schemas/Timestamp'
    Until:
      name: until
      in: query
      required: false
      description: Only milestones whose current status was reached before this time (exclusive, UTC). Must be later than `since`.
      schema:
        $ref: '#/components/schemas/Timestamp'
    MilestoneStatusFilter:
      name: status
      in: query
      required: false
      description: Only milestones in these statuses. Repeat the parameter for several, e.g. `?status=failed&status=blocked`.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 5
        items:
          $ref: '#/components/schemas/MilestoneStatus'
    MilestoneCategoryFilter:
      name: category
      in: query
      required: false
      description: Only milestones in these categories. Repeat the parameter for several.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 4
        items:
          $ref: '#/components/schemas/MilestoneCategory'
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items on the page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        The `next_cursor` of the previous page. It is opaque: clients must
        not build or decode it. It is valid only with the same filters it was
        issued for; otherwise the response is 400 `invalid_cursor`.
      schema:
        type: string
        minLength: 1
        maxLength: 512
        pattern: '^[A-Za-z0-9_-]+$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A unique value the client generates for each new attempt, e.g. a
        UUID, and reuses unchanged on every retry of that attempt.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]+$'
      example: 6f1c8e2a-3d4b-4f7a-9c1e-2b8d5a7f0e93
  headers:
    Location:
      description: Path of the created or decided resource.
      schema:
        type: string
        format: uri-reference
    IdempotentReplayed:
      description: Present, with value `true`, when the response is a replay of an earlier request with the same Idempotency-Key.
      schema:
        type: string
        enum: ['true']
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
    WWWAuthenticate:
      description: 'The authentication scheme (RFC 6750), e.g. `Bearer realm="agent-factory", error="invalid_token"`.'
      required: true
      schema:
        type: string
        pattern: '^Bearer realm="agent-factory"'
  responses:
    BadRequest:
      description: |
        The request could not be understood. Codes:
        - `malformed_request`: the body is not JSON, or not `application/json`;
        - `idempotency_key_required`: the header is missing;
        - `invalid_cursor`: the cursor is malformed, expired, or was issued for different filters.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalid_cursor:
              value:
                type: 'urn:agent-factory:problem:invalid_cursor'
                title: Invalid cursor
                status: 400
                detail: The cursor was issued for different filters; start again without a cursor.
                instance: /api/v1/projects/prj-4f6c2a9e1b7d3c5a8e0f/milestones
                code: invalid_cursor
                request_id: req_7Hc2kQ9xLm4N
    Unauthorized:
      description: |
        The request is not authenticated. Codes:
        - `authentication_required`: no access token was sent;
        - `invalid_token`: a token was sent and refused, for any reason
          (malformed, bad signature, expired, wrong issuer or audience,
          unknown or disabled identity). The response does not say which.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            expired_token:
              value:
                type: 'urn:agent-factory:problem:invalid_token'
                title: Invalid credentials
                status: 401
                detail: The access token was not accepted. Sign in again to get a new one.
                code: invalid_token
                request_id: req_V4n7Qe2Ws8Lk
    Forbidden:
      description: |
        `forbidden`: the identity is authenticated but lacks the permission
        this operation requires (`required_permission`). It reveals nothing
        else about the identity.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            cannot_decide:
              value:
                type: 'urn:agent-factory:problem:forbidden'
                title: Forbidden
                status: 403
                detail: This identity does not have the permission this operation requires.
                code: forbidden
                request_id: req_P8d3Ht6Mn1Cz
                required_permission: approvals:decide
    TooManyRequests:
      description: |
        `too_many_requests`: too many refused credentials from this client,
        or too many decisions by this identity. Retry after `Retry-After`
        seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: |
        A resource in the path does not exist. Codes: `project_not_found`,
        `run_not_found`, `approval_not_found`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            project_not_found:
              value:
                type: 'urn:agent-factory:problem:project_not_found'
                title: Project not found
                status: 404
                detail: No project has the ID prj-0000000000000000000a.
                instance: /api/v1/projects/prj-0000000000000000000a
                code: project_not_found
                request_id: req_P8s3nW2qXe7R
    IdempotencyConflict:
      description: |
        The request conflicts with what the server already holds for this
        Idempotency-Key. Nothing was created. Codes:
        - `idempotency_key_reused`: the key was already used with a different request body. Do not retry; send the new request with a new key;
        - `idempotency_key_in_use`: a request with the same key is still being processed. Retry the same request later.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            key_reused:
              summary: The same key was sent with a different body
              value:
                type: 'urn:agent-factory:problem:idempotency_key_reused'
                title: Idempotency key reused
                status: 409
                detail: This Idempotency-Key was already used for a different request; use a new key.
                instance: /api/v1/projects
                code: idempotency_key_reused
                request_id: req_K3d7Wn5pLq2X
    ApprovalConflict:
      description: |
        The decision conflicts with the approval's current state. Nothing was
        recorded. Codes:
        - `action_fingerprint_mismatch`: the fingerprint is not that of this approval's exact action;
        - `approval_already_decided`: a different decision is already recorded. `approval` shows it;
        - `approval_expired`: the request expired before a decision;
        - `approval_cancelled`: the request no longer applies.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            fingerprint_mismatch:
              summary: The screen showed a different (stale or altered) action
              value:
                type: 'urn:agent-factory:problem:action_fingerprint_mismatch'
                title: Action fingerprint mismatch
                status: 409
                detail: The decision is for a different action than this approval request. Reload the approval and decide again.
                instance: /api/v1/projects/prj-4f6c2a9e1b7d3c5a8e0f/approvals/apr-d2d69f6b7a0ce595/decision
                code: action_fingerprint_mismatch
                request_id: req_Q4v9mB1tZc6Y
            already_decided:
              summary: Someone already rejected it
              value:
                type: 'urn:agent-factory:problem:approval_already_decided'
                title: Approval already decided
                status: 409
                detail: This approval was already rejected.
                instance: /api/v1/projects/prj-4f6c2a9e1b7d3c5a8e0f/approvals/apr-d2d69f6b7a0ce595/decision
                code: approval_already_decided
                request_id: req_J2h8sD5kWq3E
                approval:
                  id: apr-d2d69f6b7a0ce595
                  project_id: prj-4f6c2a9e1b7d3c5a8e0f
                  project_name: Client ETL Pipeline
